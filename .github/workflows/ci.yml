name: CI

# Every push to master and every pull request runs the suite on Linux, macOS and Windows: a link runs in a window
# and in Node on all three. A newer push to the same branch or pull request cancels the run before it.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:floor
      - run: npm run build
      - run: npm test
      - run: npm run fuzz
      - run: npm run reference:check
      - run: npm run workflows:check
      - run: npm run package:lint
      # The package as a consumer gets it: packed, installed elsewhere, consumer types checked, and the README's example run from it.
      - run: npm run package:smoke

  browser:
    name: browser (chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  # The one check a release waits on: every job above passed.
  ci-pass:
    if: always()
    needs: [suite, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.suite.result }}" = "success" && test "${{ needs.browser.result }}" = "success"
